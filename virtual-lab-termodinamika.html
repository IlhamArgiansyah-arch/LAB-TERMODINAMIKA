<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Lab Termodinamika</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.55}
#app{max-width:1000px;margin:0 auto;padding:0 16px 60px}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#b45309);color:#fff;border-radius:0 0 22px 22px;padding:34px 30px;margin-bottom:22px}
.hero h1{font-size:30px;margin:0}.hero p{margin:.5em 0 0;opacity:.9;max-width:720px}
.card{background:#fff;border-radius:14px;padding:20px 22px;box-shadow:0 1px 4px rgba(15,23,42,.1);margin-bottom:20px}
.idg{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.idg label{font-size:13px;font-weight:600;color:#475569;display:block}
input[type=text],textarea,select{font:inherit;border:1.5px solid #cbd5e1;border-radius:8px;padding:7px 10px;width:100%;background:#fff;color:inherit}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid #38bdf8;border-color:#38bdf8}
textarea{resize:vertical;min-height:54px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
[data-go]{cursor:pointer}
.mc{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:14px;padding:18px;border-top:6px solid var(--c);box-shadow:0 1px 4px rgba(15,23,42,.1);transition:transform .15s,box-shadow .15s}
.mc:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(15,23,42,.15)}
.mc .ico{font-size:34px}.mc .no{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.08em}
.mc h3{margin:.1em 0;font-size:18px}.mc p{margin:0;font-size:13.5px;color:#475569}
.mc .pg{margin-top:10px;font-size:12.5px;color:#334155;background:#f1f5f9;border-radius:8px;padding:4px 8px;display:inline-block}
.mh{background:var(--c);color:#fff;border-radius:0 0 18px 18px;padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mh h1{font-size:22px;margin:0;flex:1}.mh small{display:block;font-weight:400;opacity:.9;font-size:14px}
.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 16px;background:#0f172a;color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.25)}.btn.sm{padding:6px 12px;font-size:14px}.btn.lt{background:#fff;color:#0f172a}
.btn.rec{background:#ea580c}.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;position:sticky;top:0;background:#f1f5f9;padding:8px 0;z-index:5}
.tabs button{font:inherit;font-size:14px;font-weight:600;border:1.5px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;color:#334155}
.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.panel{display:none;background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 1px 4px rgba(15,23,42,.1);margin-bottom:18px}
.panel.on{display:block}
.panel>h2{border-bottom:3px solid var(--c);padding-bottom:6px;font-size:21px}
.step{background:#eff6ff;border-left:5px solid #3b82f6;border-radius:8px;padding:10px 14px;margin:12px 0}
.story{background:#fffbeb;border-left:5px solid #f59e0b;border-radius:8px;padding:12px 16px;margin:12px 0}
.lab{border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;margin:14px 0;background:#f8fafc}
.stage canvas{display:block;max-width:100%;height:auto;background:#fff;border-radius:10px;margin:0 auto;border:1px solid #e2e8f0}
.read{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;justify-content:center}
.read div{background:#0f172a;color:#fff;border-radius:8px;padding:5px 12px;font-size:14px}
.read span{opacity:.75;margin-right:6px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;margin-top:10px}
.sl{flex:1;min-width:190px;font-size:14px}.sl span{display:block;margin-bottom:2px}.sl input[type=range]{width:100%}
table.data{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.data th{background:#1e293b;color:#fff;padding:6px 8px}
table.data td{border:1px solid #cbd5e1;padding:5px 8px;text-align:center}
table.data td button{border:0;background:none;color:#dc2626;cursor:pointer;font-weight:700}
.ask{margin:12px 0}.ask label{font-weight:600;display:block;margin-bottom:4px}
.pick{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}
.pick span{flex:1;min-width:260px}.pick select{width:auto;min-width:190px}
select.ok{border-color:#16a34a;background:#dcfce7}select.no{border-color:#dc2626;background:#fee2e2}
.konsep{background:#ecfdf5;border:2px solid #10b981;border-radius:12px;padding:14px 18px;margin-top:14px}
.konsep h3{color:#047857}
.rumus{font-family:Cambria,"Times New Roman",serif;font-size:19px;background:#fff;border-radius:8px;padding:6px 14px;display:inline-block;margin:4px 6px 4px 0;border:1px solid #a7f3d0}
.qz{border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin:14px 0;break-inside:avoid}
.qn{font-weight:700;color:var(--c)}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ans input{width:140px}
.fb{font-weight:600}
.score{background:#0f172a;color:#fff;border-radius:10px;padding:8px 16px;display:inline-block;font-size:17px}
.warn{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;padding:10px 14px;margin:12px 0}
.printhead{display:none;border:2px solid #0f172a;border-radius:8px;padding:10px 16px;margin-bottom:14px}
.printhead h1{font-size:19px;margin:0 0 6px}.printhead table td{padding:1px 10px 1px 0;vertical-align:top}
footer{text-align:center;color:#64748b;font-size:13px;margin-top:26px}
body.printing .panel{display:block}
@media print{
  body{background:#fff}#app{max-width:none;padding:0}
  .noprint,.ctrl,.tabs,.mh{display:none!important}
  .panel{display:block!important;box-shadow:none;padding:6px 0;margin:0 0 10px}
  .printhead{display:block}
  .lab,.qz,table.data,.konsep,.ask{break-inside:avoid}
  .stage canvas{max-width:78%}
  textarea,input[type=text],select{border:1px solid #94a3b8}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= PENYIMPANAN ================= */
const KEY='termolab_v1';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({id:{kelas:'',kelompok:'',anggota:['','','','','']},f:{},t:{},q:{}},S||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app'),R=8.31;
const fmt=x=>{if(typeof x!='number')return x;if(!isFinite(x))return '–';if(Math.abs(x)<1e-9)return '0';return String(Number(x.toPrecision(4))).replace('.',',')};
const num=s=>parseFloat(String(s).replace(',','.'));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function grow(e){if(e.tagName=='TEXTAREA'){e.style.height='auto';e.style.height=(e.scrollHeight+2)+'px'}}

/* ================= PEMBANTU HTML ================= */
let KP='',kn=0;const K=()=>KP+'.'+(kn++);
const ask=(q,r=2)=>`<div class="ask"><label>${q}</label><textarea data-k="${K()}" rows="${r}" placeholder="Tulis jawaban kelompokmu…"></textarea></div>`;
const pick=(q,opts,a)=>`<div class="pick"><span>${q}</span><select data-k="${K()}" data-a="${a}"><option value="">— pilih —</option>${opts.map((o,i)=>`<option value="${i}">${o}</option>`).join('')}</select></div>`;
const step=t=>`<div class="step">${t}</div>`;
const BS=['Benar','Salah'];
function mark(e){if(e.dataset.a==null)return;e.classList.toggle('ok',e.value!==''&&e.value===e.dataset.a);e.classList.toggle('no',e.value!==''&&e.value!==e.dataset.a)}
function bindFields(root){$$('[data-k]',root).forEach(e=>{const k=e.dataset.k;e.value=S.f[k]??'';const up=()=>{S.f[k]=e.value;save();mark(e);grow(e)};e.oninput=up;e.onchange=up;mark(e)})}

/* ================= GAMBAR ================= */
function tcol(T,a=1){const h=Math.max(0,Math.min(240,240-(T-100)/700*240));return `hsla(${h},85%,48%,${a})`}
function mkPs(n){return Array.from({length:n},()=>({x:Math.random(),y:Math.random(),vx:Math.random()*2-1,vy:Math.random()*2-1}))}
function drawCyl(g,x,y,w,h,o){
  const gw=Math.max(20,w*o.frac),sp=Math.sqrt(Math.max(o.T,1)/300)*(o.dt||0)*160;let hits=0;
  g.save();g.fillStyle=tcol(o.T,.15);g.fillRect(x,y,gw,h);g.fillStyle=tcol(o.T);
  const n=Math.min(Math.round(o.n||40),o.ps.length);
  for(let i=0;i<n;i++){const p=o.ps[i];p.x+=p.vx*sp/gw;p.y+=p.vy*sp/h;
    if(p.x<0){p.x=-p.x;p.vx=-p.vx;hits++}if(p.x>1){p.x=2-p.x;p.vx=-p.vx;hits++}
    if(p.y<0){p.y=-p.y;p.vy=-p.vy;hits++}if(p.y>1){p.y=2-p.y;p.vy=-p.vy;hits++}
    p.x=Math.max(0,Math.min(1,p.x));p.y=Math.max(0,Math.min(1,p.y));
    g.beginPath();g.arc(x+p.x*gw,y+p.y*h,3,0,7);g.fill()}
  const lw=o.insul?10:4;g.strokeStyle=o.insul?'#d97706':'#334155';g.lineWidth=lw;
  g.beginPath();g.moveTo(x+w+18,y-lw/2);g.lineTo(x-lw/2,y-lw/2);g.lineTo(x-lw/2,y+h+lw/2);g.lineTo(x+w+18,y+h+lw/2);g.stroke();
  g.fillStyle='#64748b';g.fillRect(x+gw,y,12,h);g.fillRect(x+gw+12,y+h/2-4,(w-gw)+18,8);
  g.textAlign='center';
  if(o.lock){g.font='18px sans-serif';g.fillText('🔒',x+gw+6,y-12)}
  if(o.insul){g.font='bold 11px sans-serif';g.fillStyle='#b45309';g.fillText('dinding terisolasi',x+w/2,y-14)}
  if(o.heat){g.font='26px sans-serif';g.fillText(o.heat>0?'🔥':'❄️',x+gw/2,y+h+36)}
  g.restore();return hits}
function drawGraph(g,x,y,w,h,o){
  const X=a=>x+a/o.xm*w,Y=b=>y+h-Math.max(0,Math.min(b,o.ym*1.03))/o.ym*h;
  g.save();g.lineWidth=1;g.font='11px sans-serif';
  for(let i=0;i<=5;i++){const xx=x+w*i/5,yy=y+h-h*i/5;g.strokeStyle='#e2e8f0';g.beginPath();g.moveTo(xx,y);g.lineTo(xx,y+h);g.moveTo(x,yy);g.lineTo(x+w,yy);g.stroke();
    g.fillStyle='#64748b';g.textAlign='center';g.fillText(fmt(o.xm*i/5),xx,y+h+14);g.textAlign='right';g.fillText(fmt(o.ym*i/5),x-5,yy+4)}
  g.strokeStyle='#334155';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+h);g.lineTo(x+w,y+h);g.stroke();
  g.fillStyle='#0f172a';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(o.xl,x+w/2,y+h+30);
  g.save();g.translate(x-42,y+h/2);g.rotate(-Math.PI/2);g.fillText(o.yl,0,0);g.restore();
  const path=p=>{g.beginPath();p.forEach((q,i)=>i?g.lineTo(X(q[0]),Y(q[1])):g.moveTo(X(q[0]),Y(q[1])))};
  (o.fills||[]).forEach(f=>{if(f.pts.length<2)return;path(f.pts);const a=f.pts[0],b=f.pts[f.pts.length-1];g.lineTo(X(b[0]),Y(0));g.lineTo(X(a[0]),Y(0));g.closePath();g.fillStyle=f.col;g.fill()});
  (o.polys||[]).forEach(f=>{path(f.pts);g.closePath();g.fillStyle=f.col;g.fill()});
  (o.curves||[]).forEach(c=>{path(c.pts);g.strokeStyle=c.col;g.lineWidth=c.w||2.5;g.setLineDash(c.dash||[]);g.stroke();g.setLineDash([])});
  (o.dots||[]).forEach(d=>{g.fillStyle=d[2]||'#f97316';g.beginPath();g.arc(X(d[0]),Y(d[1]),4,0,7);g.fill()});
  if(o.pt){g.fillStyle='#dc2626';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(X(o.pt[0]),Y(o.pt[1]),6,0,7);g.fill();g.stroke()}
  g.restore()}
function arrow(g,x1,y1,x2,y2,wd,col){const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1),hd=Math.min(L,Math.max(12,wd*.9));
  g.save();g.translate(x1,y1);g.rotate(a);g.fillStyle=col;g.fillRect(0,-wd/2,L-hd,wd);g.beginPath();g.moveTo(L-hd,-wd/2-6);g.lineTo(L,0);g.lineTo(L-hd,wd/2+6);g.fill();g.restore()}
function txt(g,s,x,y,o={}){g.save();g.font=(o.b===false?'':'bold ')+(o.s||12)+'px sans-serif';g.fillStyle=o.c||'#0f172a';g.textAlign=o.a||'left';g.fillText(s,x,y);g.restore()}
function drawBars(g,x,y,w,h,it,max,signed){const bw=w/it.length,z=signed?y+h/2:y+h,sc=(signed?h/2:h)/max;
  g.save();g.strokeStyle='#334155';g.lineWidth=1.5;g.beginPath();g.moveTo(x,z);g.lineTo(x+w,z);g.stroke();
  it.forEach((b,i)=>{const bh=Math.max(-max,Math.min(max,b.v))*sc,cx=x+i*bw+bw/2;g.fillStyle=b.col;g.fillRect(cx-bw*.3,z-bh,bw*.6,bh);
    txt(g,b.l,cx,y+h+16,{a:'center'});txt(g,fmt(b.v)+' J',cx,z-bh+(bh>=0?-6:14),{a:'center',b:false})});g.restore()}
function drawFlow(g,cx,y,o){
  const sc=E=>3+Math.abs(E)/o.max*30,box=(yy,f,s,t)=>{g.fillStyle=f;g.strokeStyle=s;g.lineWidth=2;g.fillRect(cx-115,yy,230,40);g.strokeRect(cx-115,yy,230,40);txt(g,t,cx,yy+25,{a:'center',c:s,s:13})};
  box(y,'#fecaca','#b91c1c','Reservoir panas'+(o.TH?' ('+fmt(o.TH)+' K)':''));
  box(y+228,'#bfdbfe','#1d4ed8','Reservoir dingin'+(o.TC?' ('+fmt(o.TC)+' K)':''));
  const my=y+134;
  if(!o.fr){arrow(g,cx,y+42,cx,my-32,sc(o.QH),'#ef4444');if(o.QC>0)arrow(g,cx,my+32,cx,y+226,sc(o.QC),'#3b82f6');if(o.W>0)arrow(g,cx+32,my,cx+125,my,sc(o.W),'#16a34a')}
  else{arrow(g,cx,y+226,cx,my+32,sc(o.QC),'#3b82f6');arrow(g,cx,my-32,cx,y+42,sc(o.QH),'#ef4444');arrow(g,cx+125,my,cx+32,my,sc(o.W),'#16a34a')}
  g.fillStyle='#fde68a';g.strokeStyle='#92400e';g.lineWidth=3;g.beginPath();g.arc(cx,my,32,0,7);g.fill();g.stroke();
  txt(g,o.name||'Mesin',cx,my+4,{a:'center'});
  txt(g,'Q_H = '+fmt(o.QH)+' J',cx+28,y+72,{c:'#b91c1c'});txt(g,'Q_C = '+fmt(o.QC)+' J',cx+28,y+204,{c:'#1d4ed8'});txt(g,'W = '+fmt(o.W)+' J',cx+132,my+4,{c:'#15803d'})}

/* ================= MESIN LAB ================= */
function lab(host,c,key){
  const v={},st={};
  host.innerHTML=`<div class="lab"><div class="stage"><canvas width="${c.w||680}" height="${c.h||300}"></canvas><div class="read"></div></div><div class="ctrl">`+
    (c.sliders||[]).map(s=>`<label class="sl"><span>${s.l}: <b data-o="${s.id}"></b> ${s.u||''}</span><input type="range" data-s="${s.id}" min="${s.min}" max="${s.max}" step="${s.step||1}" value="${s.val}"></label>`).join('')+
    (c.selects||[]).map(s=>`<label class="sl"><span>${s.l}</span><select data-s="${s.id}">${s.o.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>`).join('')+
    (c.btns||[]).map((b,i)=>`<button class="btn sm" data-b="${i}">${b.l}</button>`).join('')+
    (c.cols?`<button class="btn sm rec">📋 Catat data</button>`:'')+`</div></div>`+(c.cols?`<table class="data"></table>`:'');
  const cv=$('canvas',host),g=cv.getContext('2d'),rd=$('.read',host),tb=$('table',host);
  const els=$$('[data-s]',host),rdv=e=>{const id=e.dataset.s;v[id]=e.type=='range'?+e.value:e.value;const o=$(`[data-o="${id}"]`,host);if(o)o.textContent=fmt(v[id])};
  els.forEach(rdv);els.forEach(e=>{const up=()=>{rdv(e);c.chg&&c.chg(v,st)};e.oninput=up;e.onchange=up});
  $$('[data-b]',host).forEach(b=>b.onclick=()=>c.btns[+b.dataset.b].f(v,st));
  const rows=S.t[key]||(S.t[key]=[]);st.rows=rows;
  const drawT=()=>{if(!tb)return;tb.innerHTML=`<tr>${c.cols.map(h=>`<th>${h}</th>`).join('')}<th class="noprint"></th></tr>`+
    (rows.length?rows.map((r,i)=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}<td class="noprint"><button data-d="${i}" title="Hapus baris">✕</button></td></tr>`).join(''):
    `<tr><td colspan="${c.cols.length+1}" style="color:#64748b">Belum ada data — atur simulasi lalu tekan “Catat data”.</td></tr>`)};
  if(tb){drawT();tb.onclick=e=>{if(e.target.dataset.d!=null){rows.splice(+e.target.dataset.d,1);save();drawT()}};
    $('.rec',host).onclick=()=>{if(rows.length>=10){alert('Maksimal 10 baris data. Hapus baris yang tidak perlu.');return}rows.push(c.row(v,st).map(fmt));save();drawT()}}
  c.init&&c.init(v,st);let last='';
  return dt=>{g.clearRect(0,0,cv.width,cv.height);c.draw(g,v,st,dt);
    if(c.read){const s=c.read(v,st).map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');if(s!=last){rd.innerHTML=s;last=s}}}}
function tab(el,html,...cfgs){el.innerHTML=html;const hs=$$('.host',el),kp=KP;const ts=cfgs.map((c,i)=>lab(hs[i],c,kp+'.L'+i));return dt=>ts.forEach(f=>f(dt))}

/* ================= TAMPILAN ================= */
const M=[];let cur=null;
const score=m=>Math.round(m.quiz.filter((q,i)=>(S.q[m.id+'.'+i]||{}).ok).length*100/m.quiz.length);
const idOK=()=>S.id.kelas.trim()&&S.id.kelompok.trim()&&S.id.anggota.filter(a=>a.trim()).length>=3;
function home(){cur=null;document.title='Virtual Lab Termodinamika';
  app.innerHTML=`<header class="hero"><h1>🔥 Akademi Insinyur Mesin Kalor</h1><p><b>Virtual Lab Termodinamika.</b> Kalian adalah tim insinyur muda. Selesaikan 8 misi: lakukan percobaan, catat data, temukan sendiri konsepnya, lalu buktikan dengan hitungan. Misi boleh dikerjakan dalam urutan apa pun.</p></header>
  <section class="card"><h2>👥 Identitas Kelompok</h2><p style="margin-top:0;color:#475569">Isi dulu sebelum memulai misi (3–5 anggota). Data tersimpan otomatis di laptop ini.</p>
  <div class="idg"><div><label>Kelas</label><input type="text" data-id="kelas" placeholder="mis. XI-3"></div><div><label>Nama kelompok</label><input type="text" data-id="kelompok" placeholder="mis. Tim Carnot"></div>
  ${[0,1,2,3,4].map(i=>`<div><label>Anggota ${i+1}${i<3?' *':' (opsional)'}</label><input type="text" data-id="${i}" placeholder="Nama lengkap"></div>`).join('')}</div></section>
  <h2>🗺️ Peta Misi</h2><div class="grid">${M.map((m,i)=>{const nf=Object.keys(S.f).filter(k=>k.startsWith(m.id+'.')&&String(S.f[k]).trim()).length;
    return `<a class="mc" role="button" tabindex="0" data-go="${m.id}" style="--c:${m.col}"><div class="ico">${m.ico}</div><div class="no">MISI ${i+1}</div><h3>${m.name}</h3><p>${m.sub}</p><span class="pg">${nf?'✍️ '+nf+' isian · ':''}🎯 Skor ${score(m)}</span></a>`}).join('')}</div>
  <footer>Satu misi untuk satu pertemuan · Tekan “Cetak PDF” di dalam misi untuk membuat laporan kelompok.</footer>`;
  $$('[data-id]').forEach(e=>{const k=e.dataset.id,isA=/^\d$/.test(k);e.value=isA?S.id.anggota[+k]:S.id[k];e.oninput=()=>{if(isA)S.id.anggota[+k]=e.value;else S.id[k]=e.value;save()}})}
function openMission(m){

const PN={isoT:'Isotermal',isoV:'Isokhorik',isoP:'Isobarik',adia:'Adiabatik'};
function pst(type,v){const T0=300,V0=10,P0=R*T0/V0,gm=5/3;let V=V0,T=T0,P=P0,W=0,pts=[];
  if(type=='isoT'){V=v.V;P=R*T0/V;W=R*T0*Math.log(V/V0);for(let i=0;i<=40;i++){const x=V0+(V-V0)*i/40;pts.push([x,R*T0/x])}}
  else if(type=='isoV'){T=v.T;P=R*T/V0;pts=[[V0,P0],[V0,P]]}
  else if(type=='isoP'){T=v.T;V=V0*T/T0;W=P0*(V-V0);pts=[[V0,P0],[V,P0]]}
  else{V=v.V;P=P0*Math.pow(V0/V,gm);T=T0*Math.pow(V0/V,gm-1);W=(P0*V0-P*V)/(gm-1);for(let i=0;i<=40;i++){const x=V0+(V-V0)*i/40;pts.push([x,P0*Math.pow(V0/x,gm)])}}
  const dU=1.5*R*(T-T0);return{P,V,T,W,dU,Q:dU+W,pts,P0,V0,T0}}
function pcfg(type,full){const ps=mkPs(40),SV={id:'V',l:'Volume',min:5,max:24,step:1,val:10,u:'L'},ST={id:'T',l:'Suhu',min:150,max:720,step:30,val:300,u:'K'};
  const useV=t=>t=='isoT'||t=='adia',tp=v=>type||v.jenis,X={isoT:['P × V',s=>s.P*s.V],isoV:['P / T',s=>s.P/s.T],isoP:['V / T',s=>s.V/s.T],adia:['P × V',s=>s.P*s.V]};
  return{sliders:type?[useV(type)?SV:ST]:[SV,ST],selects:type?[]:[{id:'jenis',l:'Jenis proses',o:Object.entries(PN)}],
  draw(g,v,st,dt){const t=tp(v),s=pst(t,v);drawCyl(g,30,70,250,130,{frac:s.V/25,T:s.T,ps,dt,lock:t=='isoV',insul:t=='adia',heat:Math.abs(s.Q)<1?0:s.Q});

    d>0?arrow(g,280,100,400,100,12,'#f97316'):arrow(g,400,100,280,100,12,'#f97316');txt(g,'Q = '+v.Q+' J',340,80,{a:'center',c:'#c2410c'});
    txt(g,'ΔS total = '+fmt(s.tot)+' J/K  →  '+(s.tot>0?'✔ dapat terjadi spontan':'✖ tidak pernah terjadi spontan'),340,190,{a:'center',s:14,c:s.tot>0?'#15803d':'#b91c1c'})},
  cols:['Arah','Q (J)','T<sub>H</sub> (K)','T<sub>C</sub> (K)','ΔS panas (J/K)','ΔS dingin (J/K)','ΔS total (J/K)'],row(v){const s=this.calc(v);return[+v.arah>0?'Panas → dingin':'Dingin → panas',v.Q,v.TH,v.TC,s.sh,s.sc,s.tot]}})},
{t:'🧊 Kulkas / AC',b:el=>tab(el,`${step('Mesin pendingin <b>ideal</b> memindahkan kalor Q<sub>C</sub> dari ruang dingin ke ruang panas dengan bantuan usaha W dari kompresor (listrik). Atur suhu ruang dingin, suhu luar, dan usaha kompresor. Catat minimal 5 data.')}<div class="host"></div>
${ask('Tuliskan hubungan Q<sub>H</sub>, Q<sub>C</sub>, dan W pada mesin pendingin. Mengapa bagian belakang kulkas terasa hangat?')}${ask('<b>Koefisien performansi (K<sub>p</sub>)</b> = kalor yang dipindahkan tiap satuan usaha. Bandingkan kolom Q<sub>C</sub>/W dengan kolom T<sub>C</sub>/(T<sub>H</sub> − T<sub>C</sub>). Tuliskan dua rumus K<sub>p</sub>.')}${ask('Apakah kulkas melanggar pernyataan Clausius? Jelaskan.')}${ask('Berdasarkan datamu, mengapa AC lebih boros listrik jika disetel pada suhu yang sangat rendah atau ketika cuaca di luar sangat panas?')}`,
 {h:310,sliders:[{id:'TC',l:'Suhu ruang dingin T_C',min:250,max:290,step:5,val:270,u:'K'},{id:'TH',l:'Suhu luar T_H',min:295,max:320,step:5,val:300,u:'K'},{id:'W',l:'Usaha kompresor W',min:50,max:500,step:50,val:100,u:'J'}],
  calc:v=>{const K=v.TC/(v.TH-v.TC),QC=K*v.W;return{K,QC,QH:QC+v.W}},
  draw(g,v){const s=this.calc(v);drawFlow(g,300,15,{fr:true,QH:s.QH,QC:s.QC,W:v.W,max:Math.max(3000,s.QH),TH:v.TH,TC:v.TC,name:'Kulkas'});txt(g,'Suhu ruang dingin = '+(v.TC-273)+' °C',20,270,{c:'#1d4ed8'});txt(g,'Suhu luar = '+(v.TH-273)+' °C',20,40,{c:'#b91c1c'})},
  read(v){const s=this.calc(v);return[['Q_C diserap',fmt(s.QC)+' J'],['Q_H dibuang',fmt(s.QH)+' J'],['K_p',fmt(s.K)]]},
  cols:['T<sub>C</sub> (K)','T<sub>H</sub> (K)','W (J)','Q<sub>C</sub> (J)','Q<sub>H</sub> (J)','Q<sub>C</sub> / W','T<sub>C</sub> / (T<sub>H</sub> − T<sub>C</sub>)'],row(v){const s=this.calc(v);return[v.TC,v.TH,v.W,s.QC,s.QH,s.QC/v.W,v.TC/(v.TH-v.TC)]}})}],
kq:['Tuliskan Hukum II Termodinamika menurut pernyataan Clausius dan Kelvin-Planck dengan bahasamu sendiri.','Jelaskan pengertian entropi dan hubungannya dengan arah proses spontan.','Jelaskan cara kerja mesin pendingin dan rumus koefisien performansinya.'],
konsep:`<p><b>Pernyataan Clausius:</b> kalor tidak mungkin mengalir secara spontan dari benda bersuhu rendah ke benda bersuhu tinggi tanpa usaha dari luar.</p>
<p><b>Pernyataan Kelvin-Planck:</b> tidak mungkin membuat mesin yang bekerja dalam satu siklus dan mengubah seluruh kalor yang diserapnya menjadi usaha (tidak ada mesin berefisiensi 100%).</p>
<p><b>Entropi</b> = ukuran ketidakteraturan sistem. Pada proses spontan, entropi total (sistem + lingkungan) selalu bertambah.</p><span class="rumus">ΔS = Q / T</span><span class="rumus">ΔS<sub>total</sub> ≥ 0</span>
<p><b>Mesin pendingin</b> (kulkas, AC) memindahkan kalor dari reservoir dingin ke reservoir panas dengan bantuan usaha luar, jadi tidak melanggar Clausius.</p>
<span class="rumus">Q<sub>H</sub> = Q<sub>C</sub> + W</span><span class="rumus">K<sub>p</sub> = Q<sub>C</sub> / W = Q<sub>C</sub> / (Q<sub>H</sub> − Q<sub>C</sub>)</span><span class="rumus">K<sub>p</sub> ideal = T<sub>C</sub> / (T<sub>H</sub> − T<sub>C</sub>)</span>`,
quiz:[
{q:'Sebuah kulkas menyerap kalor 600 J dari ruang penyimpanan dengan usaha kompresor 200 J. Berapakah koefisien performansi kulkas tersebut?',a:3,u:'(tanpa satuan)'},
{q:'Untuk kulkas pada soal nomor 1, berapakah kalor yang dibuang ke udara luar?',a:800,u:'J'},
{q:'Sebuah kulkas ideal menjaga suhu di dalamnya −3 °C sementara suhu ruangan 27 °C. Berapakah koefisien performansinya?',a:9,u:'(tanpa satuan)'},
{q:'Kalor sebesar 1200 J mengalir spontan dari reservoir bersuhu 600 K ke reservoir bersuhu 300 K. Berapakah perubahan entropi total kedua reservoir?',a:2,u:'J/K'},
{q:'Sebuah AC ideal menjaga suhu kamar 17 °C ketika suhu udara luar 37 °C. AC memindahkan kalor 2900 J dari kamar setiap detik. Berapakah daya listrik minimum yang diperlukan kompresor?',a:200,u:'W'}]});
